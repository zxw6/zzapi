spring:
  application:
    name: ai-gateway
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/zxw?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:82.157.100.179}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:syf33618}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:5s}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-mysql.sql

server:
  port: 9988
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

gateway:
  security:
    jwt-secret: ${JWT_SECRET:ai-gateway-jwt-secret-please-change-1234567890}
    jwt-expire-minutes: ${JWT_EXPIRE_MINUTES:720}
    crypto-secret: ${GATEWAY_CRYPTO_SECRET:AiCryptoKey12345}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:*}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    exposed-headers: ${CORS_EXPOSED_HEADERS:}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
    max-age: ${CORS_MAX_AGE:3600}

app:
  auth:
    verification-code:
      expire-seconds: ${VERIFICATION_CODE_EXPIRE_SECONDS:300}
      resend-interval-seconds: ${VERIFICATION_CODE_RESEND_INTERVAL_SECONDS:60}
      return-code-in-response: ${VERIFICATION_CODE_RETURN_IN_RESPONSE:true}
