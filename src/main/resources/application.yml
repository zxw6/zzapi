spring:
  application:
    name: ai-gateway
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/zxw?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-mysql.sql

server:
  port: 9988
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

gateway:
  security:
    jwt-secret: ${JWT_SECRET:ai-gateway-jwt-secret-please-change-1234567890}
    jwt-expire-minutes: ${JWT_EXPIRE_MINUTES:720}
    crypto-secret: ${GATEWAY_CRYPTO_SECRET:AiCryptoKey12345}
